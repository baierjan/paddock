    <text x="706" y="165" font-family="IosevkaTerm Nerd Font, Menlo, Consolas, DejaVu Sans Mono, Liberation Mono, monospace" font-size="14" fill="#6e7681">ai@paddock:~/sandbox</text>

    <text x="684" y="222" font-family="IosevkaTerm Nerd Font, Menlo, Consolas, DejaVu Sans Mono, Liberation Mono, monospace" font-size="21">
