    </text>
    <text x="684" y="342" font-family="IosevkaTerm Nerd Font, Menlo, Consolas, DejaVu Sans Mono, Liberation Mono, monospace" font-size="21">
      <tspan fill="#22c55e">[ OK ]</tspan><tspan fill="#e6edf3"> Isolated in a hardened microVM</tspan>
    </text>
    <text x="684" y="396" font-family="IosevkaTerm Nerd Font, Menlo, Consolas, DejaVu Sans Mono, Liberation Mono, monospace" font-size="21" font-weight="700" fill="#38bdf8">~/sandbox</text>
    <text x="684" y="436" font-family="IosevkaTerm Nerd Font, Menlo, Consolas, DejaVu Sans Mono, Liberation Mono, monospace" font-size="21" font-weight="700">
      <tspan fill="#f87171">&#11042; [podman]</tspan><tspan fill="#22c55e"> &#10095;</tspan>
    </text>
