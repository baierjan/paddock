  <text x="150" y="270" font-family="IosevkaTerm Nerd Font, Menlo, Consolas, DejaVu Sans Mono, Liberation Mono, monospace" font-size="80" font-weight="700" fill="#f0f6fc">Paddock</text>

  <text x="82" y="326" font-family="IosevkaTerm Nerd Font, Menlo, Consolas, DejaVu Sans Mono, Liberation Mono, monospace" font-size="28" fill="#9aa4ae">Hardened microVM sandbox</text>
  <text x="82" y="362" font-family="IosevkaTerm Nerd Font, Menlo, Consolas, DejaVu Sans Mono, Liberation Mono, monospace" font-size="28" fill="#9aa4ae">for AI coding CLIs</text>

  <text x="82" y="420" font-family="IosevkaTerm Nerd Font, Menlo, Consolas, DejaVu Sans Mono, Liberation Mono, monospace" font-size="20" letter-spacing="1"><tspan fill="#6b8f75">podman</tspan><tspan fill="#22c55e" opacity="0.6"> &#183; </tspan><tspan fill="#6b8f75">krun</tspan><tspan fill="#22c55e" opacity="0.6"> &#183; </tspan><tspan fill="#6b8f75">pasta</tspan></text>

  <!-- Right column: terminal window -->
