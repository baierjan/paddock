<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Paddock icon">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e12"/>
      <stop offset="100%" stop-color="#121a1f"/>
    </linearGradient>
  </defs>
  <rect x="40" y="40" width="432" height="432" rx="96" fill="url(#bgGrad)"/>
  <rect x="42" y="42" width="428" height="428" rx="94" fill="none" stroke="#22c55e" stroke-opacity="0.45" stroke-width="4"/>

  <!-- Fence enclosure: 4 rails -->
