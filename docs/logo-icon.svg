  <rect x="94" y="252" width="24" height="8" fill="#22c55e" opacity="0.6"/>
  <rect x="94" y="327" width="24" height="8" fill="#22c55e" opacity="0.6"/>
  <rect x="394" y="177" width="24" height="8" fill="#22c55e" opacity="0.6"/>
